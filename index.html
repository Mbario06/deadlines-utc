// Load saved state
function loadState() {
  try { return JSON.parse(localStorage.getItem('deadline-state') || '{}'); } catch { return {}; }
}
function saveState(state) {
  localStorage.setItem('deadline-state', JSON.stringify(state));
}
let state = loadState();

function getDeadlineStatus(dateStr) {
  const now = new Date();
  const deadline = new Date(dateStr + 'T23:59:00');
  const diffMs = deadline - now;
  const diffDays = Math.ceil(diffMs / (1000 * 60 * 60 * 24));
  if (diffDays < 0) return { cls: 'done', label: 'Passée', days: diffDays };
  if (diffDays <= 7) return { cls: 'urgent', label: `J-${diffDays}`, days: diffDays };
  if (diffDays <= 30) return { cls: 'soon', label: `J-${diffDays}`, days: diffDays };
  return { cls: 'later', label: `J-${diffDays}`, days: diffDays };
}

function formatDate(dateStr, time) {
  const d = new Date(dateStr);
  const days = ['dim', 'lun', 'mar', 'mer', 'jeu', 'ven', 'sam'];
  const months = ['jan', 'fév', 'mar', 'avr', 'mai', 'jun', 'jul', 'aoû', 'sep', 'oct', 'nov', 'déc'];
  let str = `${days[d.getDay()]} ${d.getDate()} ${months[d.getMonth()]} ${d.getFullYear()}`;
  if (time) str += ` à ${time}`;
  return str;
}

function getProgress(dl) {
  const tasks = dl.tasks;
  if (!tasks || tasks.length === 0) return 0;
  const done = tasks.filter(t => state[t.id]).length;
  return Math.round((done / tasks.length) * 100);
}

function renderDeadlines() {
  const container = document.getElementById('deadlines-container');
  const showDone = container.dataset.showDone !== 'false';

  // Sort by date
  const sorted = [...DEADLINES].sort((a, b) => new Date(a.date) - new Date(b.date));

  let html = '';
  sorted.forEach(dl => {
    const status = getDeadlineStatus(dl.date);
    const progress = getProgress(dl);
    const cardDone = progress === 100;

    if (cardDone && !showDone) return;

    const cardStatus = cardDone ? 'done' : status.cls;
    const badgeLabels = { urgent: '🚨 Urgent', soon: '⚠️ Bientôt', later: '📌 À venir', done: '✅ Passé' };
    const isOpen = state[`open_${dl.id}`] ? 'open' : '';

    html += `
    <div class="deadline-card ${cardStatus}" id="card-${dl.id}">
      <div class="card-header" onclick="toggleCard('${dl.id}')">
        <span class="badge ${cardStatus}">${badgeLabels[cardStatus]}</span>
        <span class="card-title">${dl.title}</span>
        <span class="card-date">${formatDate(dl.date, dl.time)}</span>
        <span class="days-left ${cardStatus}">${status.days >= 0 ? status.label : 'Passée'}</span>
        <span class="card-expand" id="arrow-${dl.id}">${isOpen ? '▲' : '▼'}</span>
      </div>
      <div class="card-body ${isOpen}" id="body-${dl.id}">
        <div class="card-desc">${dl.description}</div>
        ${dl.tasks && dl.tasks.length > 0 ? `
        <div class="tasks-title">Tâches associées</div>
        ${dl.tasks.map(t => `
          <div class="task-item">
            <div class="task-check ${state[t.id] ? 'checked' : ''}" onclick="toggleTask('${t.id}', '${dl.id}')"></div>
            <span class="task-label ${state[t.id] ? 'done-task' : ''}">${t.label}</span>
            <span class="task-tag">${dl.category}</span>
          </div>
        `).join('')}
        <div class="progress-bar-wrap">
          <div class="progress-bar-label">
            <span>Progression</span>
            <span>${progress}% (${dl.tasks.filter(t => state[t.id]).length}/${dl.tasks.length})</span>
          </div>
          <div class="progress-bar">
            <div class="progress-fill" style="width: ${progress}%"></div>
          </div>
        </div>
        ` : ''}
      </div>
    </div>`;
  });

  container.innerHTML = html;
  updateStats();
}

function toggleCard(id) {
  const key = `open_${id}`;
  state[key] = !state[key];
  saveState(state);
  renderDeadlines();
}

function toggleTask(taskId, dlId) {
  state[taskId] = !state[taskId];
  saveState(state);
  renderDeadlines();
}

function toggleDone() {
  const container = document.getElementById('deadlines-container');
  container.dataset.showDone = container.dataset.showDone === 'false' ? 'true' : 'false';
  renderDeadlines();
}

function expandAll() {
  DEADLINES.forEach(dl => { state[`open_${dl.id}`] = true; });
  saveState(state);
  renderDeadlines();
}

function collapseAll() {
  DEADLINES.forEach(dl => { state[`open_${dl.id}`] = false; });
  saveState(state);
  renderDeadlines();
}

function updateStats() {
  const counts = { urgent: 0, soon: 0, later: 0, done: 0 };
  DEADLINES.forEach(dl => {
    const progress = getProgress(dl);
    const cardDone = progress === 100;
    if (cardDone) { counts.done++; return; }
    const s = getDeadlineStatus(dl.date).cls;
    if (s === 'done') counts.done++;
    else counts[s]++;
  });
  document.getElementById('stat-urgent').textContent = counts.urgent;
  document.getElementById('stat-soon').textContent = counts.soon;
  document.getElementById('stat-later').textContent = counts.later;
  document.getElementById('stat-done').textContent = counts.done;
}

// Init
const now = new Date();
document.getElementById('current-date').textContent = `Aujourd'hui : ${now.toLocaleDateString('fr-FR', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' })}`;
document.getElementById('gen-date').textContent = now.toLocaleDateString('fr-FR');

renderDeadlines();
</script>
